{
  "schema_version": 1,
  "policy": {
    "max_retries": 3,
    "production_mutations_allowed": false,
    "production_mutations_require_human_approval": true,
    "budget_approval_variable": "DEVOBS_AI_BUDGET_APPROVED",
    "budget_approval_is_dollar_cap": false,
    "unmeasured_baseline_blocks_autonomous_production_use": true
  },
  "agents": [
    {
      "id": "ai-code-review",
      "workflow": ".github/workflows/ai-code-review.yml",
      "provider": "OpenAI API",
      "model": "Codex action; version pinned in workflow",
      "objective": "Provide advisory findings on changes in a pull request.",
      "success_metric": "Median time from PR opened to first maintainer review; compare with a pre-AI baseline.",
      "baseline_status": "not_measured",
      "estimated_cost_usd_per_run": null,
      "cost_status": "potentially_billable; account quota and price are unverified",
      "budget_gate": "DEVOBS_AI_BUDGET_APPROVED must equal true before credential access or inference",
      "max_retries": 0,
      "max_provider_calls_per_run": 1,
      "human_review": "All findings are advisory; CI and a maintainer decide merge.",
      "production_write": false
    },
    {
      "id": "claude-code-assistant",
      "workflow": ".github/workflows/claude-code-assistant.yml",
      "provider": "Anthropic API",
      "model": "Claude Code action; version pinned in workflow",
      "objective": "Answer an explicit maintainer request with read-only repository guidance.",
      "success_metric": "Maintainer accepted suggestions per invocation; compare with a pre-AI baseline.",
      "baseline_status": "not_measured",
      "estimated_cost_usd_per_run": null,
      "cost_status": "potentially_billable; account quota and price are unverified",
      "budget_gate": "DEVOBS_AI_BUDGET_APPROVED must equal true before credential access or inference",
      "max_retries": 0,
      "max_provider_calls_per_run": 1,
      "human_review": "Only owner/member/collaborator mentions trigger it; output is suggestions only.",
      "production_write": false
    },
    {
      "id": "incident-investigator-copilot",
      "workflow": ".github/workflows/incident-investigator.md",
      "provider": "GitHub Copilot",
      "model": "gpt-4.1",
      "objective": "Summarize evidence from a trusted CI incident for human investigation.",
      "success_metric": "Median time to maintainer incident triage and proportion of reports with verified evidence.",
      "baseline_status": "not_measured",
      "estimated_cost_usd_per_run": null,
      "cost_status": "account-plan-dependent; exact USD cost is unverified",
      "budget_gate": "DEVOBS_AI_BUDGET_APPROVED=true, human-reviewed incident label, and GH-AW credit cap; credit cap is not USD",
      "max_retries": 0,
      "max_provider_calls_per_run": 1,
      "human_review": "Requires trusted incident evidence and maintainer-applied human-reviewed label; report only.",
      "production_write": false
    },
    {
      "id": "incident-investigator-claude-fallback",
      "workflow": ".github/workflows/incident-investigator-claude.md",
      "provider": "Anthropic API",
      "model": "Sonnet; model identifier is configured in workflow",
      "objective": "Provide a one-time alternative incident summary when explicitly selected.",
      "success_metric": "Verified evidence coverage and time to maintainer triage.",
      "baseline_status": "not_measured",
      "estimated_cost_usd_per_run": null,
      "cost_status": "potentially_billable; account quota and price are unverified",
      "budget_gate": "DEVOBS_AI_BUDGET_APPROVED=true, manual workflow dispatch, and human-reviewed issue",
      "max_retries": 0,
      "max_provider_calls_per_run": 1,
      "human_review": "Read-only evidence; a maintainer must review before any operational action.",
      "production_write": false
    },
    {
      "id": "incident-investigator-vertex-fallback",
      "workflow": ".github/workflows/incident-investigator-vertex.md",
      "provider": "Vertex AI Gemini",
      "model": "gemini-2.5-pro",
      "objective": "Provide one bounded alternative incident summary after an eligible failure.",
      "success_metric": "Verified evidence coverage and time to maintainer triage.",
      "baseline_status": "not_measured",
      "estimated_cost_usd_per_run": null,
      "cost_status": "metered; account quota and price are unverified",
      "budget_gate": "DEVOBS_AI_BUDGET_APPROVED=true, manual workflow dispatch, and trusted incident eligibility",
      "max_retries": 0,
      "max_provider_calls_per_run": 1,
      "human_review": "Read-only evidence; report remains subject to maintainer review.",
      "production_write": false
    },
    {
      "id": "efficiency-improver",
      "workflow": ".github/workflows/efficiency-improver.md",
      "provider": "GitHub Copilot",
      "model": "gpt-4.1",
      "objective": "Find measurable performance improvements and prepare at most one draft PR.",
      "success_metric": "Measured page performance change on the same benchmark before and after.",
      "baseline_status": "not_measured",
      "estimated_cost_usd_per_run": null,
      "cost_status": "account-plan-dependent; exact USD cost is unverified",
      "budget_gate": "DEVOBS_AI_BUDGET_APPROVED=true, manual workflow dispatch, and GH-AW credit cap; credit cap is not USD",
      "max_retries": 0,
      "max_provider_calls_per_run": 1,
      "human_review": "Draft PR only; maintainer review and required CI precede merge.",
      "production_write": false
    },
    {
      "id": "phase8b-patch-preparer",
      "workflow": ".github/workflows/phase8b-ai-patch-generator.md",
      "provider": "GitHub Copilot",
      "model": "gpt-4.1",
      "objective": "Prepare one allowlisted recovery draft for a verified incident.",
      "success_metric": "Proportion of draft fixes confirmed by maintainers and required CI.",
      "baseline_status": "not_measured",
      "estimated_cost_usd_per_run": null,
      "cost_status": "account-plan-dependent; exact USD cost is unverified",
      "budget_gate": "DEVOBS_AI_BUDGET_APPROVED=true, manual workflow dispatch, and GH-AW credit cap; credit cap is not USD",
      "max_retries": 0,
      "max_provider_calls_per_run": 1,
      "human_review": "One draft PR limited to an allowlist; no merge or deployment.",
      "production_write": false
    }
  ]
}
