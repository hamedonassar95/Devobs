name: Dispatch successful build to Devobs

on:
  workflow_run:
    workflows: ["Devobs AI Intelligence CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: devobs-dispatch-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >
      github.event.workflow_run.name == 'Devobs AI Intelligence CI' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted dispatcher from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Send metadata-only repository dispatch
        env:
          DEVOBS_REPOSITORY_DISPATCH_TOKEN: ${{ secrets.DEVOBS_REPOSITORY_DISPATCH_TOKEN }}
        run: node scripts/repository_dispatch.mjs
