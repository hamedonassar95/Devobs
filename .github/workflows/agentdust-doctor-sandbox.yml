name: AgentDust Doctor Sandbox

on:
  push:
    branches:
      - test/agentdust-doctor-diagnostics
    paths:
      - .github/workflows/agentdust-doctor-sandbox.yml

permissions:
  contents: read

jobs:
  doctor-sandbox:
    name: Read-only AgentDust doctor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify pinned package and run doctor in isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          fail() {
            echo "$1" >&2
            exit 1
          }

          os_id="$(sed -n 's/^ID=//p' /etc/os-release | head -n 1 | tr -d '"')"
          os_version="$(sed -n 's/^VERSION_ID=//p' /etc/os-release | head -n 1 | tr -d '"')"
          architecture="$(uname -m)"
          kernel="$(uname -r)"
          printf 'os=%s %s\narchitecture=%s\nkernel=%s\n' "$os_id" "$os_version" "$architecture" "$kernel"

          [[ "$os_id" == ubuntu && "$os_version" == 24.04 ]] || fail 'Unsupported operating system; expected Ubuntu 24.04.'
          [[ "$architecture" == x86_64 ]] || fail 'Unsupported architecture; expected x86_64 for the pinned linux-x64 package.'
          [[ -n "${RUNNER_TEMP:-}" && "$RUNNER_TEMP" == /* && -d "$RUNNER_TEMP" && ! -L "$RUNNER_TEMP" ]] || fail 'Runner temporary directory is unavailable or unsafe.'

          runner_temp_real="$(realpath -e -- "$RUNNER_TEMP" 2>/dev/null)" || fail 'Could not resolve the runner temporary directory.'
          work_dir=''
          work_dir_real=''
          work_dir_identity=''
          cleanup() {
            local status=$?
            local expected_prefix="${runner_temp_real%/}/agentdust-doctor."
            local current_temp_real=''
            local current_work_dir_real=''
            local current_work_dir_identity=''
            trap - EXIT
            if [[ -n "$work_dir" ]]; then
              current_temp_real="$(realpath -e -- "$RUNNER_TEMP" 2>/dev/null || true)"
              current_work_dir_real="$(realpath -e -- "$work_dir" 2>/dev/null || true)"
              current_work_dir_identity="$(stat -c '%d:%i' -- "$work_dir" 2>/dev/null || true)"
            fi
            if [[ -n "$work_dir" && -n "$work_dir_real" && -d "$work_dir" && ! -L "$work_dir" && \
              "$current_temp_real" == "$runner_temp_real" && "$current_work_dir_real" == "$work_dir_real" && \
              "$current_work_dir_identity" == "$work_dir_identity" && \
              "$work_dir_real" == "$expected_prefix"* ]]; then
              if ! rm -rf -- "$work_dir" 2>/dev/null; then
                echo 'WARNING: temporary workspace cleanup failed.' >&2
                [[ "$status" -ne 0 ]] || status=1
              fi
            elif [[ -n "$work_dir" ]]; then
              echo 'WARNING: temporary workspace path changed; cleanup was refused.' >&2
              [[ "$status" -ne 0 ]] || status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          if ! work_dir="$(mktemp -d "${runner_temp_real%/}/agentdust-doctor.XXXXXX" 2>/dev/null)"; then
            fail 'Could not create a private temporary workspace.'
          fi
          work_dir_real="$(realpath -e -- "$work_dir" 2>/dev/null)" || fail 'Could not verify the temporary workspace path.'
          work_dir_identity="$(stat -c '%d:%i' -- "$work_dir" 2>/dev/null)" || fail 'Could not verify the temporary workspace identity.'
          [[ -d "$work_dir" && ! -L "$work_dir" && "$work_dir_real" == "${runner_temp_real%/}/agentdust-doctor."* ]] || fail 'Temporary workspace was not created under the expected runner directory.'

          data_dir="$work_dir/data"
          home_dir="$work_dir/home"
          tmp_dir="$work_dir/tmp"
          package_dir="$work_dir/package"
          archive="$work_dir/agentdust-1.8.1.tgz"
          doctor_output="$work_dir/doctor.json"
          doctor_stderr="$work_dir/doctor.stderr"
          curl_stderr="$work_dir/curl.stderr"
          mkdir -m 700 "$data_dir" "$home_dir" "$tmp_dir" "$package_dir" 2>/dev/null || fail 'Could not create private sandbox directories.'
          mkdir -m 700 "$home_dir/.config" "$home_dir/.cache" "$home_dir/.local" "$home_dir/.local/share" "$home_dir/.local/state" 2>/dev/null || fail 'Could not create private home directories.'

          data_filesystem="$(findmnt --noheadings --target "$data_dir" --output FSTYPE 2>/dev/null | tr -d '[:space:]')" || fail 'Could not inspect the AgentDust data directory filesystem.'
          printf 'data_filesystem=%s\n' "$data_filesystem"
          [[ "$data_filesystem" == ext4 ]] || fail 'The isolated AgentDust data directory is not on ext4; doctor was not run.'
          [[ -w "$data_dir" ]] || fail 'The isolated AgentDust data directory is not writable.'

          package_url='https://registry.npmjs.org/agentdust/-/agentdust-1.8.1.tgz'
          # Without --location curl does not follow redirects; accept only HTTP 200.
          if ! http_status="$(curl --fail --silent --show-error --max-redirs 0 --max-filesize 20971520 \
            --connect-timeout 15 --max-time 90 --proto '=https' --tlsv1.2 \
            --write-out '%{http_code}' --output "$archive" "$package_url" 2>"$curl_stderr")"; then
            fail 'Could not retrieve the pinned AgentDust package archive.'
          fi
          [[ "$http_status" == 200 ]] || fail 'Package server returned a non-200 response; refusing redirects.'

          python3 - "$archive" "$package_dir" <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          # Exact npm archive digest accepted by the pinned Sigstore verification workflow.
          expected_sri = "sha512-5dKzxVjA448uWKnkcwS6z3ChqN5n6NhhU4ctv5nQtxJh10l823hB7eDyjwD7pFSxehNZ4zvsrhYpegpaTIRevQ=="
          expected_files = {
              "package/vendor/darwin-arm64/agentdust",
              "package/vendor/linux-x64/agentdust",
              "package/LICENSE",
              "package/bin/agentdust.js",
              "package/package.json",
              "package/README.md",
          }
          launcher_name = "package/bin/agentdust.js"
          binary_name = "package/vendor/linux-x64/agentdust"

          def reject():
              print("Pinned package validation failed.", file=sys.stderr)
              raise SystemExit(1)

          try:
              archive_path = Path(sys.argv[1])
              package_root = Path(sys.argv[2])
              if archive_path.stat().st_size > 20 * 1024 * 1024:
                  reject()
              blob = archive_path.read_bytes()
              actual_sri = "sha512-" + base64.b64encode(hashlib.sha512(blob).digest()).decode("ascii")
              if actual_sri != expected_sri:
                  reject()

              with tarfile.open(fileobj=io.BytesIO(blob), mode="r:gz") as tar:
                  members = tar.getmembers()
                  names = [member.name for member in members]
                  if len(names) != len(expected_files) or set(names) != expected_files:
                      reject()
                  if len(set(names)) != len(names):
                      reject()
                  total_size = 0
                  by_name = {}
                  for member in members:
                      path = PurePosixPath(member.name)
                      if path.is_absolute() or "\\" in member.name or any(part in {"", ".", ".."} for part in member.name.split("/")):
                          reject()
                      if member.issym() or member.islnk() or not member.isfile() or member.size < 0 or member.size > 8 * 1024 * 1024:
                          reject()
                      total_size += member.size
                      if total_size > 16 * 1024 * 1024:
                          reject()
                      by_name[member.name] = member

                  manifest_stream = tar.extractfile(by_name["package/package.json"])
                  if manifest_stream is None:
                      reject()
                  manifest = json.loads(manifest_stream.read())
                  if manifest.get("name") != "agentdust" or manifest.get("version") != "1.8.1":
                      reject()
                  if manifest.get("bin") != {"agentdust": "bin/agentdust.js"}:
                      reject()
                  if manifest.get("scripts"):
                      reject()
                  for field in ("dependencies", "devDependencies", "optionalDependencies", "peerDependencies"):
                      if manifest.get(field):
                          reject()

                  for name in (launcher_name, binary_name):
                      member = by_name[name]
                      source = tar.extractfile(member)
                      if source is None:
                          reject()
                      content = source.read(member.size + 1)
                      if len(content) != member.size:
                          reject()
                      destination = package_root.joinpath(*PurePosixPath(name).parts[1:])
                      destination.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                      destination.write_bytes(content)
                      os.chmod(destination, 0o700)

              print("package_sha512=PASS")
              print("package_layout=PASS")
              print("install_scripts=ABSENT")
          except SystemExit:
              raise
          except Exception:
              reject()
          PY

          report_validator="$work_dir/doctor-report-validator.py"
          cat > "$report_validator" <<'PY'
          import json
          import sys
          from pathlib import Path

          MAX_JSON_BYTES = 2 * 1024 * 1024
          MAX_FINDINGS = 10000
          # Failure output is restricted to fixed codes; never include report or stderr text.
          EXPECTED_COUNT_KEYS = {
              "managed",
              "owned-live",
              "owned-ended",
              "likely-owned",
              "suspect",
              "unknown",
          }


          class ReportValidationError(Exception):
              def __init__(self, code):
                  self.code = code


          def validate_report(raw_report):
              if len(raw_report) > MAX_JSON_BYTES:
                  raise ReportValidationError("report_too_large")
              try:
                  report = json.loads(raw_report)
              except (json.JSONDecodeError, UnicodeDecodeError, RecursionError, ValueError):
                  raise ReportValidationError("invalid_json") from None

              if type(report) is not dict:
                  raise ReportValidationError("report_not_object")
              if type(report.get("version")) is not int or report["version"] != 1:
                  raise ReportValidationError("version_mismatch")

              counts = report.get("counts")
              if type(counts) is not dict:
                  raise ReportValidationError("counts_not_object")
              if set(counts) != EXPECTED_COUNT_KEYS:
                  raise ReportValidationError("count_keys_mismatch")
              if any(type(value) is not int or value < 0 for value in counts.values()):
                  raise ReportValidationError("count_values_invalid")

              findings = report.get("findings")
              if type(findings) is not list:
                  raise ReportValidationError("findings_not_array")
              if len(findings) > MAX_FINDINGS:
                  raise ReportValidationError("findings_limit_exceeded")

              return {
                  "processes_detected": sum(counts.values()),
                  "findings": len(findings),
              }


          def evaluate_report(raw_report, doctor_exit_code):
              try:
                  metrics = validate_report(raw_report)
              except ReportValidationError as error:
                  return None, error.code
              if doctor_exit_code != 0:
                  return metrics, "doctor_nonzero"
              return metrics, None


          def synthetic_report():
              return {
                  "version": 1,
                  "counts": {
                      "managed": 1,
                      "owned-live": 0,
                      "owned-ended": 0,
                      "likely-owned": 0,
                      "suspect": 0,
                      "unknown": 2,
                  },
                  "findings": [],
              }


          def self_test():
              valid = synthetic_report()

              def encoded(report):
                  return json.dumps(report, separators=(",", ":")).encode("utf-8")

              def expect_case(name, raw_report, doctor_exit_code, expected_code):
                  metrics, actual_code = evaluate_report(raw_report, doctor_exit_code)
                  actual_code = actual_code or "PASS"
                  if actual_code != expected_code:
                      raise AssertionError(name)
                  if expected_code in {"PASS", "doctor_nonzero"} and metrics != {
                      "processes_detected": 3,
                      "findings": 0,
                  }:
                      raise AssertionError(name)

              expect_case("valid", encoded(valid), 0, "PASS")
              expect_case("invalid_json_with_zero_exit", b"{", 0, "invalid_json")
              expect_case("non_object", b"[]", 0, "report_not_object")

              case = dict(valid, version=2)
              expect_case("version", encoded(case), 0, "version_mismatch")
              case = dict(valid, counts=None)
              expect_case("counts_type", encoded(case), 0, "counts_not_object")
              case = dict(valid, counts={key: value for key, value in valid["counts"].items() if key != "unknown"})
              expect_case("count_keys", encoded(case), 0, "count_keys_mismatch")
              bad_counts = dict(valid["counts"], managed=True)
              expect_case("count_values", encoded(dict(valid, counts=bad_counts)), 0, "count_values_invalid")
              negative_counts = dict(valid["counts"], managed=-1)
              expect_case("negative_count_value", encoded(dict(valid, counts=negative_counts)), 0, "count_values_invalid")
              expect_case("findings_type", encoded(dict(valid, findings={})), 0, "findings_not_array")
              expect_case(
                  "findings_limit",
                  encoded(dict(valid, findings=[None] * (MAX_FINDINGS + 1))),
                  0,
                  "findings_limit_exceeded",
              )
              expect_case("json_size_limit", b" " * (MAX_JSON_BYTES + 1), 0, "report_too_large")
              expect_case("doctor_exit", encoded(valid), 7, "doctor_nonzero")
              expected_failure_output = [
                  "doctor_exit_code=0",
                  "processes_detected=unavailable",
                  "findings=unavailable",
                  "doctor_success=false",
                  "doctor_failure_reason=invalid_json",
              ]
              if render(0, None, "invalid_json") != expected_failure_output:
                  raise AssertionError("failure_output")


          def render(status, metrics, reason):
              lines = [
                  f"doctor_exit_code={status}",
                  f"processes_detected={metrics['processes_detected'] if metrics else 'unavailable'}",
                  f"findings={metrics['findings'] if metrics else 'unavailable'}",
                  f"doctor_success={'true' if reason is None else 'false'}",
              ]
              if reason is not None:
                  lines.append(f"doctor_failure_reason={reason}")
              return lines


          def emit(status, metrics, reason):
              for line in render(status, metrics, reason):
                  print(line)


          def main():
              if sys.argv[1:] == ["--self-test"]:
                  try:
                      self_test()
                  except Exception:
                      print("validator_self_tests=FAIL")
                      return 1
                  print("validator_self_tests=PASS cases=13")
                  return 0

              if len(sys.argv) != 3:
                  print("doctor_exit_code=unavailable")
                  print("processes_detected=unavailable")
                  print("findings=unavailable")
                  print("doctor_success=false")
                  print("doctor_failure_reason=invalid_invocation")
                  return 1

              status_text = sys.argv[2]
              if not status_text.isascii() or not status_text.isdecimal():
                  print("doctor_exit_code=unavailable")
                  print("processes_detected=unavailable")
                  print("findings=unavailable")
                  print("doctor_success=false")
                  print("doctor_failure_reason=invalid_doctor_exit_code")
                  return 1
              status = int(status_text)
              if status > 255:
                  print("doctor_exit_code=unavailable")
                  print("processes_detected=unavailable")
                  print("findings=unavailable")
                  print("doctor_success=false")
                  print("doctor_failure_reason=invalid_doctor_exit_code")
                  return 1

              try:
                  with Path(sys.argv[1]).open("rb") as report_file:
                      raw_report = report_file.read(MAX_JSON_BYTES + 1)
              except OSError:
                  emit(status, None, "report_unavailable")
                  return 1

              try:
                  metrics, reason = evaluate_report(raw_report, status)
              except Exception:
                  emit(status, None, "validator_internal_error")
                  return 1
              emit(status, metrics, reason)
              return 1 if reason is not None else 0


          raise SystemExit(main())
          PY
          python3 "$report_validator" --self-test

          node_path="$(command -v node || true)"
          [[ -n "$node_path" ]] || fail 'Node.js is not preinstalled on this runner; no installation was attempted.'
          node_dir="$(dirname -- "$node_path")"
          isolated_path="$package_dir/bin:$node_dir:/usr/local/bin:/usr/bin:/bin"

          cd "$tmp_dir"
          set +e
          # env -i only clears inherited variables. It does not isolate processes, files, UID, or network egress.
          # No credentials are passed, but this still runs as the ephemeral GitHub runner user.
          env -i \
            PATH="$isolated_path" \
            HOME="$home_dir" \
            XDG_CONFIG_HOME="$home_dir/.config" \
            XDG_CACHE_HOME="$home_dir/.cache" \
            XDG_DATA_HOME="$home_dir/.local/share" \
            XDG_STATE_HOME="$home_dir/.local/state" \
            TMPDIR="$tmp_dir" \
            AGENTDUST_DATA_DIR="$data_dir" \
            agentdust doctor --json >"$doctor_output" 2>"$doctor_stderr"
          doctor_status=$?
          set -e

          python3 "$report_validator" "$doctor_output" "$doctor_status"

          if (( doctor_status != 0 )); then
            exit "$doctor_status"
          fi
