name: Check Copilot Authentication

on:
  push:
    branches:
      - feat/phase-7-copilot-investigator
    paths:
      - .github/workflows/check-copilot-auth.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify Copilot credential presence
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -z "$COPILOT_TOKEN" ]; then
            echo "::error::Copilot authentication is not configured for this repository."
            exit 1
          fi
          echo "Copilot authentication is configured."
