name: Incident Response

on:
  workflow_run:
    workflows: ["CI", "Deploy Pages", "Deployment Health Check"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      workflow:
        description: Workflow to simulate
        required: true
        type: choice
        options:
          - CI
          - Deploy Pages
          - Deployment Health Check
      conclusion:
        description: Simulated conclusion
        required: true
        type: choice
        options:
          - failure
          - timed_out
          - cancelled
      dry_run:
        description: Build evidence without creating an incident issue
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: incident-response-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'workflow_run' &&
        contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion) &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (
          (github.event.workflow_run.name == 'CI' &&
            contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event)) ||
          (github.event.workflow_run.name == 'Deploy Pages' &&
            github.event.workflow_run.event == 'workflow_run') ||
          (github.event.workflow_run.name == 'Deployment Health Check' &&
            contains(fromJSON('["workflow_run","workflow_dispatch"]'), github.event.workflow_run.event))
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout trusted incident tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Resolve incident context and collect structured evidence
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MONITORED_WORKFLOW: ${{ github.event.workflow_run.name }}
          MONITORED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          MONITORED_RUN_ID: ${{ github.event.workflow_run.id }}
          MONITORED_SHA: ${{ github.event.workflow_run.head_sha }}
          MONITORED_URL: ${{ github.event.workflow_run.html_url }}
          EXPECTED_WORKFLOW: ${{ github.event.workflow_run.name }}
          EXPECTED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EXPECTED_EVENT: ${{ github.event.workflow_run.event }}
          EXPECTED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          INPUT_WORKFLOW: ${{ inputs.workflow }}
          INPUT_CONCLUSION: ${{ inputs.conclusion }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            WORKFLOW="$MONITORED_WORKFLOW"
            CONCLUSION="$MONITORED_CONCLUSION"
            RUN_ID="$MONITORED_RUN_ID"
            HEAD_SHA="$MONITORED_SHA"
            RUN_URL="$MONITORED_URL"

            gh api --method GET "repos/$GH_REPO/actions/runs/$RUN_ID" \
              --jq '{id,name,event,status,conclusion,head_branch,head_sha,head_repository:{full_name:(.head_repository.full_name // "")},html_url,created_at,updated_at,run_attempt}' \
              > incident-workflow-run.json

            API_WORKFLOW="$(jq -r '.name // ""' incident-workflow-run.json)"
            API_EVENT="$(jq -r '.event // ""' incident-workflow-run.json)"
            API_CONCLUSION="$(jq -r '.conclusion // ""' incident-workflow-run.json)"
            API_HEAD_BRANCH="$(jq -r '.head_branch // ""' incident-workflow-run.json)"
            API_HEAD_REPOSITORY="$(jq -r '.head_repository.full_name // ""' incident-workflow-run.json)"
            API_HEAD_SHA="$(jq -r '.head_sha // ""' incident-workflow-run.json)"
            API_RUN_ID="$(jq -r '.id // ""' incident-workflow-run.json)"

            if [[ "$API_WORKFLOW" != "$EXPECTED_WORKFLOW" ||
                  "$API_EVENT" != "$EXPECTED_EVENT" ||
                  "$API_CONCLUSION" != "$EXPECTED_CONCLUSION" ||
                  "$API_HEAD_BRANCH" != "$EXPECTED_HEAD_BRANCH" ||
                  "$API_HEAD_REPOSITORY" != "$EXPECTED_HEAD_REPOSITORY" ||
                  "$API_HEAD_SHA" != "$MONITORED_SHA" ||
                  "$API_RUN_ID" != "$MONITORED_RUN_ID" ||
                  "$API_HEAD_BRANCH" != "main" ||
                  "$API_HEAD_REPOSITORY" != "$GH_REPO" ]]; then
              echo "::error::Source workflow metadata failed the trusted main-repository gate."
              exit 1
            fi

            case "$API_WORKFLOW:$API_EVENT" in
              "CI:push"|"CI:workflow_dispatch"|"Deploy Pages:workflow_run"|"Deployment Health Check:workflow_run"|"Deployment Health Check:workflow_dispatch") ;;
              *)
                echo "::error::Source workflow event is not trusted for incident creation."
                exit 1
                ;;
            esac

            gh api --method GET "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '{jobs:[.jobs[] | {id,name,status,conclusion,html_url,started_at,completed_at,steps:[.steps[]? | {name,conclusion}]}]}' \
              > incident-jobs.json
          else
            WORKFLOW="$INPUT_WORKFLOW"
            CONCLUSION="$INPUT_CONCLUSION"
            RUN_ID="simulation-${GITHUB_RUN_ID}"
            HEAD_SHA="$GITHUB_SHA"
            RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

            printf '%s\n' \
              '{"simulation":true,"source":"workflow_dispatch"}' \
              > incident-workflow-run.json
            printf '{"jobs":[{"name":"simulated-failure","status":"completed","conclusion":"%s"}]}\n' \
              "$CONCLUSION" > incident-jobs.json
          fi

          {
            echo "workflow=$WORKFLOW"
            echo "conclusion=$CONCLUSION"
            echo "run_id=$RUN_ID"
            echo "head_sha=$HEAD_SHA"
            echo "run_url=$RUN_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Classify incident and prepare AI handoff
        env:
          WORKFLOW: ${{ steps.context.outputs.workflow }}
          CONCLUSION: ${{ steps.context.outputs.conclusion }}
          RUN_ID: ${{ steps.context.outputs.run_id }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          RUN_URL: ${{ steps.context.outputs.run_url }}
        run: |
          python3 scripts/incident_triage.py \
            --workflow "$WORKFLOW" \
            --conclusion "$CONCLUSION" \
            --run-id "$RUN_ID" \
            --sha "$HEAD_SHA" \
            --run-url "$RUN_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --jobs-json incident-jobs.json \
            --out-json incident.json \
            --out-markdown incident.md

      - name: Publish evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: incident-${{ steps.context.outputs.run_id }}-${{ github.run_attempt }}
          path: |
            incident.json
            incident.md
            incident-workflow-run.json
            incident-jobs.json
          if-no-files-found: error
          retention-days: 14

      - name: Add triage to workflow summary
        run: cat incident.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create incident issue and dispatch investigator
        if: github.event_name == 'workflow_run' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.context.outputs.run_id }}
          WORKFLOW: ${{ steps.context.outputs.workflow }}
          CONCLUSION: ${{ steps.context.outputs.conclusion }}
        run: |
          set -euo pipefail
          MARKER="incident-run-id:$RUN_ID"
          ISSUE_NUMBER="$(
            gh api --method GET search/issues \
              -f q="repo:$GH_REPO is:issue \"$MARKER\" in:body" \
              --jq '.items[0].number // empty'
          )"

          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_URL="$(
              gh issue create \
                --repo "$GH_REPO" \
                --title "incident: $WORKFLOW $CONCLUSION (run $RUN_ID)" \
                --body-file incident.md
            )"
            ISSUE_NUMBER="${ISSUE_URL##*/}"
            echo "Created incident issue #$ISSUE_NUMBER." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Incident already recorded in issue #$ISSUE_NUMBER." >> "$GITHUB_STEP_SUMMARY"
          fi

          ANALYSIS_COUNT="$(
            gh api --paginate --slurp --method GET \
              "repos/$GH_REPO/issues/$ISSUE_NUMBER/comments?per_page=100" |
              python3 -c 'import json, sys; from scripts.investigation_trust import trusted_investigation; pages = json.load(sys.stdin); print(sum(1 for page in pages for comment in page if trusted_investigation(comment)))'
          )"

          if [ "$ANALYSIS_COUNT" -gt 0 ]; then
            echo "AI investigation already exists on issue #$ISSUE_NUMBER; dispatch skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh workflow run incident-investigator.lock.yml \
            --repo "$GH_REPO" \
            --ref main \
            -f issue_number="$ISSUE_NUMBER"

          echo "Dispatched Copilot investigator for issue #$ISSUE_NUMBER." >> "$GITHUB_STEP_SUMMARY"
