name: Deploy to Amazon ECS

# AWS deployment is deliberately manual and disabled until the repository has
# an ECS task definition, Dockerfile, OIDC role, and protected environment.
on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Confirm an ECS production deployment from main"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ecs-production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ECS_DEPLOY_ENABLED: ${{ vars.ECS_DEPLOY_ENABLED }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate AWS configuration and build inputs
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          required = (
              "AWS_REGION",
              "AWS_ROLE_ARN",
              "ECR_REPOSITORY",
              "ECS_SERVICE",
              "ECS_CLUSTER",
              "ECS_TASK_DEFINITION",
              "ECS_CONTAINER_NAME",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if os.environ.get("ECS_DEPLOY_ENABLED") != "true":
              print("::error::Set repository variable ECS_DEPLOY_ENABLED=true only after AWS and production protections are ready.")
              sys.exit(1)
          if missing:
              print("::error::Missing repository variables: " + ", ".join(missing))
              sys.exit(1)

          workspace = pathlib.Path.cwd().resolve()
          task_path = (workspace / os.environ["ECS_TASK_DEFINITION"]).resolve()
          if task_path != workspace and workspace not in task_path.parents:
              print("::error::ECS_TASK_DEFINITION must resolve inside the checked-out repository.")
              sys.exit(1)
          if not pathlib.Path("Dockerfile").is_file():
              print("::error::Dockerfile is missing; ECS deployment cannot build an image.")
              sys.exit(1)
          if not task_path.is_file():
              print("::error::ECS task definition file is missing: " + str(task_path))
              sys.exit(1)
          try:
              task = json.loads(task_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              print("::error::ECS task definition is not readable JSON (" + type(exc).__name__ + ").")
              sys.exit(1)
          containers = task.get("containerDefinitions", [])
          if not any(item.get("name") == os.environ["ECS_CONTAINER_NAME"] for item in containers):
              print("::error::ECS_CONTAINER_NAME does not match a task definition container.")
              sys.exit(1)

          print("AWS configuration and required build files are present. Deployment can proceed after production environment approval.")
          PY

  deploy:
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
    steps:
      - name: Checkout tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build and push immutable image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --pull --tag "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@acd72bc11233ac43bac45ddb7b8e54ada737e6cd # v1.7.4
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy and wait for ECS stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@4b08990e8909cf36bc2ca95f994312f090c41865 # v2.3.4
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Record deployment evidence
        if: always()
        run: |
          {
            echo "## ECS deployment"
            echo
            echo "- Source commit: $GITHUB_SHA"
            echo "- Region: $AWS_REGION"
            echo "- ECS service stability: see the preceding deployment step"
          } >> "$GITHUB_STEP_SUMMARY"
