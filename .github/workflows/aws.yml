# Deploy only the exact image artifact produced by a successful CI run on main.
# Set ECS_DEPLOY_ENABLED=true only after the AWS, Docker, and production-approval prerequisites are ready.
name: Deploy to Amazon ECS

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]

concurrency:
  group: ecs-production-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
  ECS_TASK_EXECUTION_ROLE_ARN: ${{ vars.ECS_TASK_EXECUTION_ROLE_ARN }}

permissions:
  contents: read

jobs:
  eligible:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Confirm the tested commit is still the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_sha" == "$TESTED_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping an outdated CI run; main has moved." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: eligible
    if: ${{ needs.eligible.outputs.current == 'true' && vars.ECS_DEPLOY_ENABLED == 'true' }}
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download the CI-scanned image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ecs-container-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/ecs-container
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify and load the scanned image
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ecs-container"
          sha256sum --check devobs-site-image.tar.gz.sha256
          gzip --decompress --stdout devobs-site-image.tar.gz | docker load
          docker image inspect devobs-site:ci >/dev/null

      - name: Validate deployment configuration and files
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY ECS_SERVICE ECS_CLUSTER ECS_TASK_DEFINITION CONTAINER_NAME ECS_TASK_EXECUTION_ROLE_ARN; do
            value="$(printenv "$name" || true)"
            if [[ -z "$value" || "$value" == MY_* ]]; then
              printf "Missing or placeholder repository variable: %s\n" "$name" >&2
              exit 1
            fi
          done
          role_arn_pattern='^arn:aws(-[a-z0-9-]+)?:iam::[0-9]{12}:role/.+'
          if [[ ! "$AWS_ROLE_ARN" =~ $role_arn_pattern || ! "$ECS_TASK_EXECUTION_ROLE_ARN" =~ $role_arn_pattern ]]; then
            echo "AWS_ROLE_ARN and ECS_TASK_EXECUTION_ROLE_ARN must be IAM role ARNs." >&2
            exit 1
          fi
          case "$ECS_TASK_DEFINITION" in
            /*|..|../*|*/../*|*/..) echo "ECS_TASK_DEFINITION must be a repository-relative path." >&2; exit 1 ;;
          esac
          test -f Dockerfile
          test -f "$ECS_TASK_DEFINITION"
          task_definition_path="$(realpath -e -- "$ECS_TASK_DEFINITION")"
          case "$task_definition_path" in
            "$GITHUB_WORKSPACE"/*) ;;
            *) echo "ECS task definition must resolve inside the repository workspace." >&2; exit 1 ;;
          esac
          jq -e --arg name "$CONTAINER_NAME" '
            .networkMode == "awsvpc"
            and (.requiresCompatibilities | index("FARGATE") != null)
            and any(.containerDefinitions[]?;
              .name == $name
              and any(.portMappings[]?; .containerPort == 8080)
              and .logConfiguration.logDriver == "awslogs"
            )
          ' "$ECS_TASK_DEFINITION" >/dev/null

      - name: Prepare task definition with account-specific runtime values
        id: prepare-task-definition
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/ecs-task-definition.json"
          jq --arg role "$ECS_TASK_EXECUTION_ROLE_ARN" --arg region "$AWS_REGION" --arg name "$CONTAINER_NAME" '
            .executionRoleArn = $role
            | .containerDefinitions |= map(
                if .name == $name then
                  .logConfiguration.options["awslogs-region"] = $region
                else . end
              )
          ' "$ECS_TASK_DEFINITION" > "$generated"
          echo "path=$generated" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}



      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Tag and push the CI-scanned image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag devobs-site:ci "$image"
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Render the ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ${{ steps.prepare-task-definition.outputs.path }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy the ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          # Start the service after its zero-task CloudFormation bootstrap.
          desired-count: 1
          wait-for-service-stability: true

      # Keep deployment disabled until production reviewers and main-branch PR approval are required.