name: Deploy Pages

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable commit SHA already validated by the parent CI run
        required: true
        type: string
    outputs:
      page_url:
        description: URL returned by the Pages deployment, empty when this run was stale
        value: ${{ jobs.deploy.outputs.page_url }}

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  eligible:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Reject an outdated CI run
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [ "$CURRENT_SHA" = "$TESTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping an outdated CI run; main has moved." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Publish production site
    needs: eligible
    if: needs.eligible.outputs.current == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Stage static site
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::The tested source SHA is invalid."
            exit 1
          fi

          mkdir -p _site
          cp index.html _site/index.html
          if [ -d assets ]; then
            cp -R assets _site/assets
          fi
          printf '{"schema_version":1,"source_sha":"%s"}\n' "$SOURCE_SHA" > _site/deployment.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    needs: deploy
    if: needs.deploy.outputs.page_url != ''
    permissions:
      contents: read
    uses: ./.github/workflows/deployment-health-check.yml
    with:
      expected_sha: ${{ inputs.source_sha }}
