name: Reusable OpenSSF Scorecard report

on:
  workflow_call:
    inputs:
      upload_report_artifact:
        description: Upload the full JSON report to the caller repository's Actions artifacts.
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  scorecard:
    name: Read-only repository posture report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      checks: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out the caller repository without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-pinned Scorecard CLI
        env:
          SCORECARD_VERSION: "5.6.0"
          SCORECARD_SHA256: "19bde07129450cb65a95c6e3b9f34e034341579e6f0e241546ec3ae6efb2dd9a"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$SCORECARD_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/scorecard-extract"
          tar -xzf "$archive" -C "$RUNNER_TEMP/scorecard-extract" scorecard
          install -m 0755 "$RUNNER_TEMP/scorecard-extract/scorecard" "$RUNNER_TEMP/scorecard-bin"
          "$RUNNER_TEMP/scorecard-bin" version > "$RUNNER_TEMP/scorecard-version.txt"
          grep --fixed-strings --quiet "GitVersion:    v${SCORECARD_VERSION}" "$RUNNER_TEMP/scorecard-version.txt"

      - name: Scan the caller repository and validate the JSON report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCORECARD_REPORT: ${{ runner.temp }}/scorecard-results.json
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/scorecard-bin" \
            --local="$GITHUB_WORKSPACE" \
            --format=json \
            --show-details \
            --output="$SCORECARD_REPORT"
          test -s "$SCORECARD_REPORT"

      - name: Summarize the validated report
        env:
          SCORECARD_REPORT: ${{ runner.temp }}/scorecard-results.json
        run: |
          python3 - <<'PY'
          import html
          import json
          import math
          import os
          import re
          from pathlib import Path

          max_report_bytes = 2_000_000
          max_checks = 100
          max_cell_length = 240
          required = ("SCORECARD_REPORT", "GITHUB_STEP_SUMMARY", "GITHUB_REPOSITORY", "GITHUB_REF", "GITHUB_SHA")
          if any(not os.environ.get(name) for name in required):
              raise SystemExit("OpenSSF Scorecard summary is missing required GitHub environment values.")

          def unique_object_pairs(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON keys")
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError("invalid numeric value")

          try:
              report_bytes = Path(os.environ["SCORECARD_REPORT"]).read_bytes()
              if len(report_bytes) > max_report_bytes:
                  raise SystemExit("OpenSSF Scorecard report exceeds the 2 MB size limit.")
              report = json.loads(
                  report_bytes.decode("utf-8"),
                  object_pairs_hook=unique_object_pairs,
                  parse_constant=reject_constant,
              )
          except (OSError, UnicodeError, json.JSONDecodeError, ValueError) as error:
              raise SystemExit("OpenSSF Scorecard report is unavailable or invalid JSON.") from error

          if not isinstance(report, dict):
              raise SystemExit("OpenSSF Scorecard report must be a JSON object.")
          repository = os.environ["GITHUB_REPOSITORY"]
          source_ref = os.environ["GITHUB_REF"]
          source_sha = os.environ["GITHUB_SHA"]
          if not isinstance(repository, str) or not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise SystemExit("OpenSSF Scorecard repository identity is invalid.")
          if not source_ref or len(source_ref) > 255:
              raise SystemExit("OpenSSF Scorecard source ref is invalid.")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", source_sha):
              raise SystemExit("OpenSSF Scorecard source SHA is invalid.")

          checks = report.get("checks")
          if not isinstance(checks, list) or not checks or len(checks) > max_checks:
              raise SystemExit("OpenSSF Scorecard report must contain 1 to 100 checks.")
          if any(not isinstance(check, dict) for check in checks):
              raise SystemExit("OpenSSF Scorecard report contains an invalid check entry.")

          def markdown_cell(value):
              normalized = " ".join(value.split())
              escaped = html.escape(normalized, quote=False).replace("|", "&#124;").replace("`", "&#96;")
              escaped = escaped.replace("[", "&#91;").replace("]", "&#93;")
              return escaped[:max_cell_length] or "-"

          def score_text(value):
              if isinstance(value, bool) or not isinstance(value, (int, float)) or not math.isfinite(value):
                  return "unknown"
              if value == -1:
                  return "not applicable"
              return f"{value}/10" if 0 <= value <= 10 else "unknown"

          lines = [
              "## OpenSSF Scorecard report",
              "",
              f"Repository: `{markdown_cell(repository)}`",
              f"Source ref: `{markdown_cell(source_ref)}`",
              f"Source SHA: `{markdown_cell(source_sha)}`",
              f"Overall Scorecard score: **{score_text(report.get('score'))}**",
              f"Checks reported: **{len(checks)}**",
              "",
              "This report is informational. It does not block merges or publish results to the Scorecard API.",
              "A repository posture score is not evidence of application runtime, AI model quality, or production readiness.",
              "",
              "| Check | Score | Finding |",
              "| --- | ---: | --- |",
          ]
          for check in sorted(checks, key=lambda item: str(item.get("name", ""))):
              name = check.get("name")
              reason = check.get("reason", "")
              if not isinstance(name, str) or not name or not isinstance(reason, str):
                  raise SystemExit("OpenSSF Scorecard report contains an invalid check name or reason.")
              lines.append(f"| {markdown_cell(name)} | {score_text(check.get('score'))} | {markdown_cell(reason)} |")
          lines.append("")

          try:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("\n".join(lines))
          except OSError as error:
              raise SystemExit("OpenSSF Scorecard summary could not be written.") from error
          PY

      - name: Upload the full JSON report when the caller opts in
        if: inputs.upload_report_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssf-scorecard-${{ github.run_id }}
          path: ${{ runner.temp }}/scorecard-results.json
          if-no-files-found: error
          retention-days: 14
