name: P01 Evidence Gate (manual, advisory)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "The exact reviewed source commit SHA (no deployment)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout dispatched revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The workflow must be dispatched from main; github.sha identifies that run's commit.
          # https://docs.github.com/en/actions/learn-github-actions/contexts#github-context
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind requested SHA to exact main checkout (NO-GO on mismatch)
        env:
          CHECKED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify HEAD)"
          python3 scripts/verify_p01_checkout.py \
            --expected-sha "$CHECKED_SHA" \
            --checkout-sha "$actual_sha"
      - name: Validate evidence completeness (NO-GO by default)
        env:
          CHECKED_SHA: ${{ inputs.source_sha }}
        run: |
          python3 scripts/check_p01_evidence.py --file docs/p01/evidence.json --expected-sha "$CHECKED_SHA"
