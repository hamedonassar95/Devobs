name: Compile Agentic Workflow

on:
  push:
    branches:
      - feat/phase-7-copilot-investigator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-aw compiler
        uses: github/gh-aw/actions/setup-cli@v0.89.21
        with:
          version: v0.89.21

      - name: Compile strictly
        run: gh aw compile incident-investigator --strict

      - name: Verify lock file exists
        run: test -s .github/workflows/incident-investigator.lock.yml

      - name: Upload compiled lock file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: incident-investigator-lock
          path: .github/workflows/incident-investigator.lock.yml
          if-no-files-found: error
          retention-days: 1
