name: Compile Agentic Workflow

on:
  push:
    branches:
      - feat/phase-7-copilot-investigator
    paths:
      - .github/workflows/incident-investigator.md
      - .github/workflows/compile-agentic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install gh-aw compiler
        uses: github/gh-aw/actions/setup-cli@v0.89.21
        with:
          version: v0.89.21

      - name: Compile strictly
        run: gh aw compile incident-investigator --strict

      - name: Verify lock file exists
        run: test -s .github/workflows/incident-investigator.lock.yml

      - name: Commit compiled lock file
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/incident-investigator.lock.yml
          if git diff --cached --quiet; then
            echo "Lock file already current."
            exit 0
          fi
          git commit -m "build: compile Phase 7 agentic workflow"
          git push
