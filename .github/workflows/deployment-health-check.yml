name: Deployment Health Check

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact source commit expected in the live Pages manifest
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional full commit SHA to verify against the live deployment
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 6

    steps:
      - name: Verify deployed site
        id: verify
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
        run: |
          set -euo pipefail

          SITE_URL="https://hamedonassar95.github.io/Devobs/"
          SITE_ROOT="${SITE_URL%/}"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 10 \
            "$SITE_URL" \
            --output site.html

          grep -q "AL-DALA MOBILE" site.html

          manifest_status=""
          deployed_sha=""
          manifest_seen_200=false
          for attempt in $(seq 1 12); do
            manifest_status="$(curl \
              --location \
              --silent \
              --show-error \
              --max-time 10 \
              --header 'Cache-Control: no-cache' \
              "$SITE_ROOT/deployment.json?run_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
              --output deployment.json \
              --write-out '%{http_code}' || true)"
            if [[ "$manifest_status" == "200" ]]; then
              manifest_seen_200=true
              deployed_sha="$(jq -er 'select(.schema_version == 1) | .source_sha' deployment.json 2>/dev/null || true)"
              if [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]] && \
                 { [[ -z "$EXPECTED_SHA" ]] || [[ "$deployed_sha" == "$EXPECTED_SHA" ]]; }; then
                break
              fi
            fi
            if (( attempt < 12 )); then
              sleep 10
            fi
          done

          if [[ "$manifest_status" != "200" ]]; then
            if [[ "$manifest_status" == "404" && -z "$EXPECTED_SHA" && "$manifest_seen_200" == "false" ]]; then
              echo "::warning::This legacy deployment has no source manifest; HTTP and page content are healthy, but its commit cannot be verified."
              echo "Deployment health check passed for a legacy deployment without a source manifest." >> "$GITHUB_STEP_SUMMARY"
              echo "Deployment health check passed."
              exit 0
            fi
            echo "::error::Deployment manifest did not become available after 12 attempts; last HTTP status was $manifest_status."
            exit 1
          fi

          if [[ ! "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The deployment manifest contains an invalid source SHA."
            exit 1
          fi
          if [[ -n "$EXPECTED_SHA" && "$deployed_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Published commit $deployed_sha does not match expected commit $EXPECTED_SHA."
            exit 1
          fi

          echo "source_sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          echo "Deployment health check passed for source commit $deployed_sha." >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment health check passed for source commit $deployed_sha."
