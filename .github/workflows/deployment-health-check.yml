name: Deployment Health Check

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Pages"]
    branches: [main]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  verify-production:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Confirm the Pages workflow published an artifact
        id: pages-deploy
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          conclusions="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[]? | select(.name == "Publish production site" or .name == "deploy") | .conclusion]')"
          if [[ "$(jq 'length' <<< "$conclusions")" != "1" ]]; then
            echo "::error::Could not identify exactly one production deployment job."
            exit 1
          fi

          conclusion="$(jq -r '.[0]' <<< "$conclusions")"
          if [[ "$conclusion" == "success" ]]; then
            echo "should_verify=true" >> "$GITHUB_OUTPUT"
          elif [[ "$conclusion" == "skipped" ]]; then
            echo "should_verify=false" >> "$GITHUB_OUTPUT"
            echo "No production artifact was published because the tested CI run was stale. Source SHA comparison is skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Unexpected production deployment job conclusion: $conclusion"
            exit 1
          fi

      - name: Verify deployed site
        id: verify
        if: ${{ github.event_name == 'workflow_dispatch' || steps.pages-deploy.outputs.should_verify == 'true' }}
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail

          SITE_URL="https://hamedonassar95.github.io/Devobs/"
          SITE_ROOT="${SITE_URL%/}"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "$SITE_URL" \
            --output site.html

          grep -q "AL-DALA MOBILE" site.html

          manifest_url="$SITE_ROOT/deployment.json?run_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! manifest_status="$(curl \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --header "Cache-Control: no-cache" \
            "$manifest_url" \
            --output deployment.json \
            --write-out '%{http_code}')"; then
            echo "::error::Could not retrieve the deployment manifest."
            exit 1
          fi

          if [[ "$manifest_status" != "200" ]]; then
            if [[ "$manifest_status" == "404" && -z "$EXPECTED_SHA" ]]; then
              echo "::warning::This legacy deployment has no source manifest; HTTP and page content are healthy, but its commit cannot be verified."
              echo "Deployment health check passed for a legacy deployment without a source manifest." >> "$GITHUB_STEP_SUMMARY"
              echo "Deployment health check passed."
              exit 0
            fi
            echo "::error::Deployment manifest request returned HTTP $manifest_status."
            exit 1
          fi

          deployed_sha="$(jq -er 'select(.schema_version == 1) | .source_sha' deployment.json)"
          if [[ ! "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The deployment manifest contains an invalid source SHA."
            exit 1
          fi
          if [[ -n "$EXPECTED_SHA" && "$deployed_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Published commit $deployed_sha does not match expected commit $EXPECTED_SHA."
            exit 1
          fi

          echo "source_sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          echo "Deployment health check passed for source commit $deployed_sha." >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment health check passed for source commit $deployed_sha."
