name: Deployment Health Check

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact source commit expected in the live Pages manifest
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional full commit SHA to verify against the live deployment
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify deployed site
        id: verify
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
        run: |
          set -euo pipefail

          SITE_URL="https://hamedonassar95.github.io/Devobs/"
          SITE_ROOT="${SITE_URL%/}"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "$SITE_URL" \
            --output site.html

          grep -q "Devobs" site.html

          manifest_url="$SITE_ROOT/deployment.json?run_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # Bounded retry for transient transport failures only: at most 3
          # read-only GET attempts, 5s connect / 20s total each, with 1s then
          # 2s delays. TLS verification stays on (never --insecure/-k) and no
          # response body or environment value is printed. HTTP status handling
          # below is unchanged and is never retried, so an invalid manifest, a
          # SHA mismatch or a genuine HTTP error still fails closed.
          manifest_status=""
          manifest_exit=0
          manifest_attempt=1
          manifest_max_attempts=3
          while :; do
            manifest_exit=0
            manifest_status="$(curl \
              --location \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 20 \
              --header "Cache-Control: no-cache" \
              "$manifest_url" \
              --output deployment.json \
              --write-out '%{http_code}')" || manifest_exit=$?

            if (( manifest_exit == 0 )); then
              break
            fi

            case "$manifest_exit" in
              6|7|18|28|35|52|55|56|92) ;;
              *)
                echo "::error::Manifest fetch failed, curl exit $manifest_exit."
                exit 1
                ;;
            esac

            if (( manifest_attempt >= manifest_max_attempts )); then
              break
            fi

            echo "::warning::Manifest fetch retry (curl exit $manifest_exit)."
            sleep "$manifest_attempt"
            manifest_attempt=$(( manifest_attempt + 1 ))
          done

          if (( manifest_exit != 0 )); then
            echo "::error::Manifest fetch failed after all attempts."
            echo "::error::Last curl exit $manifest_exit."
            exit 1
          fi

          if [[ "$manifest_status" != "200" ]]; then
            if [[ "$manifest_status" == "404" && -z "$EXPECTED_SHA" ]]; then
              echo "::warning::This legacy deployment has no source manifest; HTTP and page content are healthy, but its commit cannot be verified."
              echo "Deployment health check passed for a legacy deployment without a source manifest." >> "$GITHUB_STEP_SUMMARY"
              echo "Deployment health check passed."
              exit 0
            fi
            echo "::error::Deployment manifest request returned HTTP $manifest_status."
            exit 1
          fi

          deployed_sha="$(jq -er 'select(.schema_version == 1) | .source_sha' deployment.json)"
          if [[ ! "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The deployment manifest contains an invalid source SHA."
            exit 1
          fi
          if [[ -n "$EXPECTED_SHA" && "$deployed_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Published commit $deployed_sha does not match expected commit $EXPECTED_SHA."
            exit 1
          fi

          echo "source_sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          echo "Deployment health check passed for source commit $deployed_sha." >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment health check passed for source commit $deployed_sha."
