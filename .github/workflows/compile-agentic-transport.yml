name: Transport Compiled Agentic Lock

on:
  push:
    branches: [feat/phase-7-copilot-investigator]
    paths:
      - ".github/workflows/compile-agentic-transport.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/phase-7-copilot-investigator
          persist-credentials: true

      - name: Install pinned compiler
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/github/gh-aw/releases/download/v0.89.21/linux-amd64 \
            --output /tmp/gh-aw
          echo "1c74ff5fc28b1891d32b67f4348a9b7f750946b6d4a721e909187a848868016b  /tmp/gh-aw" \
            | sha256sum --check -
          chmod +x /tmp/gh-aw

      - name: Compile strictly and stage transport blob
        run: |
          set -euo pipefail
          /tmp/gh-aw compile incident-investigator --strict
          test -s .github/workflows/incident-investigator.lock.yml
          mkdir -p generated
          cp .github/workflows/incident-investigator.lock.yml generated/incident-investigator.lock.yml
          echo "46254ee1a993cb52739fa4267da8e776e0e19d49a75844ecf70d13d95cbf9cc6  generated/incident-investigator.lock.yml" \
            | sha256sum --check -

      - name: Commit transport blob only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/incident-investigator.lock.yml
          if git diff --cached --quiet; then
            echo "Transport blob already current."
            exit 0
          fi
          git commit -m "build: stage validated agentic lock transport blob"
          git push origin HEAD:feat/phase-7-copilot-investigator
