name: AI Provider Preflight

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Select which provider configuration to validate
        required: true
        type: choice
        options:
          - both
          - copilot
          - vertex
        default: both

permissions:
  contents: none

jobs:
  copilot:
    if: github.ref == 'refs/heads/main' && (inputs.provider == 'copilot' || inputs.provider == 'both')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Check out preflight validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Copilot credential setup
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: python3 scripts/check_copilot_preflight.py

  vertex:
    if: github.ref == 'refs/heads/main' && (inputs.provider == 'vertex' || inputs.provider == 'both')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate Vertex configuration
        id: vertex_config
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_VERTEX_SERVICE_ACCOUNT: ${{ vars.GCP_VERTEX_SERVICE_ACCOUNT || secrets.GCP_VERTEX_SERVICE_ACCOUNT }}
          GCP_VERTEX_PROJECT_ID: ${{ vars.GCP_VERTEX_PROJECT_ID || secrets.GCP_VERTEX_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_VERTEX_SERVICE_ACCOUNT GCP_VERTEX_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the repository Actions variable or secret ${name}."
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            exit 1
          fi
          provider_resource="$GCP_WORKLOAD_IDENTITY_PROVIDER"
          provider_resource="${provider_resource#"${provider_resource%%[![:space:]]*}"}"
          provider_resource="${provider_resource%"${provider_resource##*[![:space:]]}"}"
          case "$provider_resource" in
            https://iam.googleapis.com/*) provider_resource="${provider_resource#https://iam.googleapis.com/}" ;;
            //iam.googleapis.com/*) provider_resource="${provider_resource#//iam.googleapis.com/}" ;;
          esac
          provider_resource="${provider_resource%/}"
          if [[ ! "$provider_resource" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/[:space:]]+/providers/[^/[:space:]]+$ ]]; then
            echo "::error::Set GCP_WORKLOAD_IDENTITY_PROVIDER to the full Google provider resource projects/<numeric-project-number>/locations/global/workloadIdentityPools/<pool-id>/providers/<provider-id>. This is not GitHub's issuer URL https://token.actions.githubusercontent.com. The configured value was not printed."
            exit 1
          fi
          echo "provider_resource=$provider_resource" >> "$GITHUB_OUTPUT"
          echo "Required Vertex settings are present and the provider resource name has the expected format."

      - name: Verify Google Cloud Workload Identity Federation
        id: google_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_VERTEX_PROJECT_ID || secrets.GCP_VERTEX_PROJECT_ID }}
          workload_identity_provider: ${{ steps.vertex_config.outputs.provider_resource }}
          service_account: ${{ vars.GCP_VERTEX_SERVICE_ACCOUNT || secrets.GCP_VERTEX_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Report preflight result
        if: steps.google_auth.outcome == 'success'
        run: echo "Google Cloud authentication succeeded. No Vertex model request was made."
