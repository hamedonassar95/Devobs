name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      controlled_incident_failure:
        description: "Intentionally fail after all checks to exercise main-branch Incident Response; this creates an incident and may dispatch the AI investigator."
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      source_ref:
        description: Commit SHA to validate when called by a guarded release workflow
        required: false
        type: string
        default: ""
      validation_profile:
        description: Validation scope for standard releases or compatibility rollback checks
        required: false
        type: string
        default: standard

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  python-tests:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      python_version: "3.12"
      compile_paths_json: '["scripts", "tests"]'
      test_runner: unittest
      test_path: tests
      source_ref: ${{ inputs.source_ref || github.sha }}

  node-tests:
    if: inputs.validation_profile != 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Run Node guard tests
        run: node --test tests/incident_guard.test.cjs

  security:
    if: inputs.validation_profile != 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require immutable GitHub Actions references
        run: |
          if [[ -f scripts/check_action_pins.py ]]; then
            python3 scripts/check_action_pins.py
          else
            echo "::notice::This historical revision predates the action-pin checker; remaining security checks still run."
          fi
      - name: Static analysis with Bandit
        run: |
          python3 -m pip install --disable-pip-version-check bandit==1.9.4
          python3 -m bandit -r scripts -x scripts/check_site.py
      - name: Scan commits for leaked secrets with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  site-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Check page contract and HTTP response
        run: python3 scripts/check_site.py
      - name: Stage isolated PR preview
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p _preview
          cp index.html _preview/index.html
          if [ -d assets ]; then cp -R assets _preview/assets; fi
      - name: Upload PR preview
        if: github.event_name == 'pull_request'
        id: preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: _preview/
          if-no-files-found: error
          retention-days: 7
      - name: Explain preview
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          {
            echo '## PR preview (downloadable HTML)'
            echo "Download: $PREVIEW_URL"
            echo 'Extract the ZIP and open index.html locally. This is not a hosted preview URL.'
            echo 'The preview is retained for 7 days and has no production deployment permissions.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Human review completed" >> "$GITHUB_STEP_SUMMARY"

  # Keep this ID: the Protect main ruleset requires the validate check.
  validate:
    if: always()
    needs: [python-tests, node-tests, security, site-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every parallel check to pass
        env:
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          NODE_RESULT: ${{ needs.node-tests.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SITE_RESULT: ${{ needs.site-contract.result }}
          VALIDATION_PROFILE: ${{ inputs.validation_profile || 'standard' }}
        run: |
          set -euo pipefail
          if [[ "$VALIDATION_PROFILE" == "rollback" ]]; then
            required_results=("$PYTHON_RESULT" "$SITE_RESULT")
            if [[ "$NODE_RESULT" != "skipped" || "$SECURITY_RESULT" != "skipped" ]]; then
              echo "::error::Rollback compatibility profile must skip only Node and security jobs."
              exit 1
            fi
          else
            required_results=("$PYTHON_RESULT" "$NODE_RESULT" "$SECURITY_RESULT" "$SITE_RESULT")
          fi
          for result in "${required_results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required validation job did not succeed: python=$PYTHON_RESULT node=$NODE_RESULT security=$SECURITY_RESULT site=$SITE_RESULT"
              exit 1
            fi
          done
          echo "All parallel validation jobs passed." >> "$GITHUB_STEP_SUMMARY"

  # One parent run owns the normal CI -> publish -> production verification path.
  production-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      source_sha: ${{ github.sha }}

  controlled-incident-drill:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.controlled_incident_failure == true
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail after successful checks to exercise incident response
        run: |
          echo "Intentional incident-response drill failure; no deployment is triggered."
          exit 1

