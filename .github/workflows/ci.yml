name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      controlled_incident_failure:
        description: "Intentionally fail after all checks to exercise main-branch Incident Response; this creates an incident and may dispatch the AI investigator."
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      source_ref:
        description: Commit SHA to validate when called by a guarded release workflow
        required: false
        type: string
        default: ""
      validation_profile:
        description: Validation scope for standard releases or compatibility rollback checks
        required: false
        type: string
        default: standard

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.validation_profile || 'standard' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  change-analysis:
    name: Change impact and risk assessment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      python_required: ${{ steps.assess.outputs.python_required }}
      node_required: ${{ steps.assess.outputs.node_required }}
      risk_score: ${{ steps.assess.outputs.risk_score }}
      risk_level: ${{ steps.assess.outputs.risk_level }}
    steps:
      - name: Check out change history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks and estimate change risk
        id: assess
        env:
          VALIDATION_PROFILE: ${{ inputs.validation_profile || 'standard' }}
        run: python3 scripts/assess_change.py

  python-tests:
    needs: change-analysis
    if: inputs.validation_profile == 'rollback' || needs.change-analysis.outputs.python_required == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      python_version: "3.12"
      requirements_file: requirements-api.txt
      compile_paths_json: '["scripts", "tests"]'
      test_runner: unittest
      test_path: tests
      source_ref: ${{ inputs.source_ref || github.sha }}

  # Disposable PostgreSQL fixture: NO external database, GCP resource or credentials.
  postgres-rls:
    if: inputs.validation_profile != 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          # CI-only ephemeral service; NEVER use trust authentication in production.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_TEST_ADMIN_DSN: postgresql://postgres@127.0.0.1:5432/postgres
      PG_TEST_READER_DSN: postgresql://devobs_ci_reader@127.0.0.1:5432/postgres
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned runtime test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-api.txt
      - name: Prove tenant row-level security on PostgreSQL
        run: python3 -m unittest discover -s tests -p 'test_postgres_rls_integration.py' -v

  node-tests:
    needs: change-analysis
    if: inputs.validation_profile != 'rollback' && needs.change-analysis.outputs.node_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Run Node guard tests
        run: node --test tests/incident_guard.test.cjs

  security:
    if: inputs.validation_profile != 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require immutable GitHub Actions references
        run: |
          if [[ -f scripts/check_action_pins.py ]]; then
            python3 scripts/check_action_pins.py
          else
            echo "::notice::This historical revision predates the action-pin checker; remaining security checks still run."
          fi
      - name: Validate AI agent inventory and guardrails
        run: python3 scripts/check_agent_spec.py
      - name: Set up Python with dependency cache
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: ${{ hashFiles('requirements-dev.txt') != '' && 'pip' || '' }}
          cache-dependency-path: requirements-dev.txt
      - name: Install security scan dependencies
        run: |
          if [[ -f requirements-dev.txt ]]; then
            python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
          else
            python3 -m pip install --disable-pip-version-check bandit==1.9.4 pip-audit==2.10.1
          fi
      - name: Static analysis with Bandit
        run: python3 -m bandit -r scripts -x scripts/check_site.py
      - name: Audit Python dependencies for known vulnerabilities
        run: |
          if [[ -f requirements-dev.txt ]]; then
            pip-audit --requirement requirements-dev.txt
            pip-audit --requirement requirements-api.txt
          else
            echo "::notice::No Python dependency manifest exists in this revision; dependency audit skipped."
          fi
      - name: Scan commits for leaked secrets with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  site-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Identify checked out source revision
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          if [[ ! "$commit_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::Checked out revision is not a full lowercase Git SHA.' >&2
            exit 1
          fi
          echo "SITE_SOURCE_SHA=$commit_sha" >> "$GITHUB_ENV"
      - name: Stage and validate site output
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stage_site.py --source-dir . --output-dir _site --source-sha "$SITE_SOURCE_SHA"
          SITE_ROOT=_site python3 scripts/check_site.py
      - name: Upload validated staged site for PR preview
        if: github.event_name == 'pull_request'
        id: preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site/
          if-no-files-found: error
          retention-days: 7
      - name: Upload validated staged site for main Pages release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-site-main-${{ github.run_id }}
          path: _site/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Explain preview
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          {
            echo '## PR preview (downloadable HTML)'
            echo "Download: $PREVIEW_URL"
            echo 'Extract the ZIP and open index.html locally. This is not a hosted preview URL.'
            echo 'The preview is retained for 7 days and has no production deployment permissions.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PR preview artifact is ready for maintainer review." >> "$GITHUB_STEP_SUMMARY"

  container-build:
    if: inputs.validation_profile != 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Build static-site image without publishing it
        env:
          IMAGE_TAG: devobs-web:${{ github.sha }}
        run: docker build --pull --tag "$IMAGE_TAG" .
      - name: Smoke-test the container over loopback
        env:
          IMAGE_TAG: devobs-web:${{ github.sha }}
        run: |
          set -euo pipefail
          container_name="devobs-web-smoke-${GITHUB_RUN_ID}"
          docker run --detach --rm --name "$container_name" --publish 127.0.0.1:18080:8080 "$IMAGE_TAG"
          trap 'docker stop "$container_name" >/dev/null 2>&1 || true' EXIT
          health_status=""
          for attempt in $(seq 1 30); do
            health_status="$(docker inspect --format '{{.State.Health.Status}}' "$container_name")"
            if [[ "$health_status" == "healthy" ]]; then
              break
            fi
            if [[ "$health_status" == "unhealthy" ]]; then
              docker inspect --format '{{json .State.Health}}' "$container_name" >&2
              exit 1
            fi
            sleep 1
          done
          if [[ "$health_status" != "healthy" ]]; then
            echo "Container health check did not pass: $health_status" >&2
            docker inspect --format '{{json .State.Health}}' "$container_name" >&2
            exit 1
          fi
          if ! curl --fail --silent --show-error http://127.0.0.1:18080/ | grep -qi '<!doctype html'; then
            echo 'Container did not serve the expected HTML page.' >&2
            exit 1
          fi
          echo 'Container is healthy and served the expected HTML page.'

  container-image-scan:
    name: Container image vulnerability scan
    if: inputs.validation_profile != 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Require the application Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f Dockerfile ]]; then
            echo '::error::Root Dockerfile is required to scan the application image.' >&2
            exit 1
          fi
      - name: Identify checked out source revision
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          if [[ ! "$commit_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::Checked out revision is not a full Git SHA.' >&2
            exit 1
          fi
          echo "COMMIT_SHA=$commit_sha" >> "$GITHUB_ENV"
      - name: Build image for vulnerability scanning
        run: |
          set -euo pipefail
          docker build --pull --tag "devobs-web:${COMMIT_SHA}" .
      - name: Install checksum-verified Trivy 0.76.1
        shell: bash
        run: |
          set -euo pipefail
          version=0.76.1
          archive="trivy_${version}_Linux-64bit.tar.gz"
          release_url="https://github.com/aquasecurity/trivy/releases/download/v${version}"
          archive_path="$RUNNER_TEMP/$archive"
          checksums_path="$RUNNER_TEMP/trivy_checksums.txt"
          install_dir="$RUNNER_TEMP/trivy-install"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error "$release_url/$archive" --output "$archive_path"
          curl --fail --location --silent --show-error "$release_url/trivy_${version}_checksums.txt" --output "$checksums_path"
          expected_checksum="$(awk -v filename="$archive" '$2 == filename { print $1 }' "$checksums_path")"
          if [[ ! "$expected_checksum" =~ ^[a-f0-9]{64}$ ]]; then
            echo 'Could not find a valid Trivy archive checksum.' >&2
            exit 1
          fi
          echo "$expected_checksum  $archive_path" | sha256sum --check --status
          tar -xzf "$archive_path" -C "$install_dir" trivy
          sudo install -m 0755 "$install_dir/trivy" /usr/local/bin/trivy
          trivy --version | grep -Fx "Version: $version"
      - name: Scan image and enforce fail-closed vulnerability policy
        env:
          REPORT_PATH: ${{ runner.temp }}/trivy-image-report.json
        # Trivy image CLI options: https://trivy.dev/latest/docs/references/configuration/cli/trivy_image/
        run: |
          set -euo pipefail
          trivy image --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --ignore-unfixed=false --exit-code 0 \
            --format json --output "$REPORT_PATH" "devobs-web:${COMMIT_SHA}"
          python3 scripts/trivy_report_policy.py \
            --report "$REPORT_PATH" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --revision "$COMMIT_SHA"
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trivy-image-report.json
          if-no-files-found: error
          retention-days: 7

  terraform-validate:
    if: inputs.validation_profile != 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform fmt -check
      - name: Initialize provider without a backend
        run: terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate Terraform configuration
        run: terraform -chdir=infra/terraform validate

  # Keep this ID: the Protect main ruleset requires the validate check.
  validate:
    if: always()
    needs: [change-analysis, python-tests, postgres-rls, node-tests, security, site-contract, container-build, container-image-scan, terraform-validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every parallel check to pass
        env:
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          NODE_RESULT: ${{ needs.node-tests.result }}
          POSTGRES_RESULT: ${{ needs.postgres-rls.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SITE_RESULT: ${{ needs.site-contract.result }}
          CONTAINER_RESULT: ${{ needs.container-build.result }}
          CONTAINER_SCAN_RESULT: ${{ needs.container-image-scan.result }}
          TERRAFORM_RESULT: ${{ needs.terraform-validate.result }}
          CHANGE_ANALYSIS_RESULT: ${{ needs.change-analysis.result }}
          PYTHON_REQUIRED: ${{ needs.change-analysis.outputs.python_required }}
          NODE_REQUIRED: ${{ needs.change-analysis.outputs.node_required }}
          VALIDATION_PROFILE: ${{ inputs.validation_profile || 'standard' }}
        run: |
          set -euo pipefail
          if [[ "$CHANGE_ANALYSIS_RESULT" != "success" ]]; then
            echo "::error::Change impact analysis did not succeed: $CHANGE_ANALYSIS_RESULT"
            exit 1
          fi
          if [[ "$VALIDATION_PROFILE" == "rollback" ]]; then
            required_results=("$PYTHON_RESULT" "$SITE_RESULT")
            if [[ "$NODE_RESULT" != "skipped" || "$SECURITY_RESULT" != "skipped" || "$POSTGRES_RESULT" != "skipped" || "$CONTAINER_RESULT" != "skipped" || "$CONTAINER_SCAN_RESULT" != "skipped" || "$TERRAFORM_RESULT" != "skipped" ]]; then
              echo "::error::Rollback compatibility profile must skip Node, security, PostgreSQL, container, image scan, and Terraform jobs."
              exit 1
            fi
          else
            if [[ "$PYTHON_REQUIRED" == "true" && "$PYTHON_RESULT" != "success" ]]; then
              echo "::error::The selected Python test suite did not succeed: $PYTHON_RESULT"
              exit 1
            fi
            if [[ "$PYTHON_REQUIRED" == "false" && "$PYTHON_RESULT" != "skipped" ]]; then
              echo "::error::Python tests ran unexpectedly for this change: $PYTHON_RESULT"
              exit 1
            fi
            if [[ "$NODE_REQUIRED" == "true" && "$NODE_RESULT" != "success" ]]; then
              echo "::error::The selected Node guard tests did not succeed: $NODE_RESULT"
              exit 1
            fi
            if [[ "$NODE_REQUIRED" == "false" && "$NODE_RESULT" != "skipped" ]]; then
              echo "::error::Node tests ran unexpectedly for this change: $NODE_RESULT"
              exit 1
            fi
            required_results=("$SECURITY_RESULT" "$SITE_RESULT" "$POSTGRES_RESULT" "$CONTAINER_RESULT" "$CONTAINER_SCAN_RESULT" "$TERRAFORM_RESULT")
          fi
          for result in "${required_results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required validation job did not succeed: python=$PYTHON_RESULT node=$NODE_RESULT security=$SECURITY_RESULT site=$SITE_RESULT container=$CONTAINER_RESULT image_scan=$CONTAINER_SCAN_RESULT terraform=$TERRAFORM_RESULT"
              exit 1
            fi
          done
          echo "All parallel validation jobs passed." >> "$GITHUB_STEP_SUMMARY"

  # One parent run owns the normal CI -> publish -> production verification path.
  production-release:
    # validate intentionally succeeds when optional language checks are skipped.
    # Use an explicit status function so GitHub's implicit success() does not
    # skip this release after any such optional job is skipped.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' }}
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      source_sha: ${{ github.sha }}

  controlled-incident-drill:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.controlled_incident_failure == true
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail after successful checks to exercise incident response
        run: |
          echo "Intentional incident-response drill failure; no deployment is triggered."
          exit 1

