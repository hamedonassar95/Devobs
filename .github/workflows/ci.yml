name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this ID: the Protect main ruleset requires the validate check.
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the validation guardrails
        run: python3 -m unittest discover -s tests -v

      - name: Test incident idempotency and duplicate guards
        run: node --test tests/incident_guard.test.cjs

      - name: Test guarded recovery planner
        run: python -m unittest tests.test_recovery_planner -v

      - name: Test isolated recovery patch guard
        run: python -m unittest tests.test_recovery_patch_guard -v

      - name: Check page contract and HTTP response
        run: python3 scripts/check_site.py

      - name: Stage isolated PR preview
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p _preview
          cp index.html _preview/index.html
          if [ -d assets ]; then
            cp -R assets _preview/assets
          fi

      - name: Upload PR preview
        if: github.event_name == 'pull_request'
        id: preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: _preview/
          if-no-files-found: error
          retention-days: 7

      - name: Explain preview
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          {
            echo '## PR preview (downloadable HTML)'
            echo "Download: $PREVIEW_URL"
            echo 'Extract the ZIP and open index.html locally. This is not a hosted preview URL.'
            echo 'The preview is retained for 7 days and has no production deployment permissions.'
          } >> "$GITHUB_STEP_SUMMARY"
