name: GitLab MR Policy Audit (Read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gitlab-mr-policy-audit-manual
  cancel-in-progress: false

jobs:
  policy:
    name: Merge-request policy only (NO SYNC, NO DEFAULT)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use pinned Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.15'

      - name: Classify GitLab merge-request policy (read-only, fails closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gitlab_merge_policy.py
