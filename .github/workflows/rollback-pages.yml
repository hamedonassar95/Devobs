name: Rollback Pages
run-name: Rollback Pages / ${{ inputs.dispatch_id || inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published stable release tag to redeploy (for example v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string
      dispatch_id:
        description: "Unique identifier for automatic rollback tracking"
        required: false
        type: string
      expected_commit_sha:
        description: "Expected immutable commit SHA (set by the automatic rollback handoff)"
        required: false
        type: string
      confirmation:
        description: "Type ROLLBACK to confirm the production rollback"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}

    steps:
      - name: Validate rollback request
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "$CONFIRMATION" != "ROLLBACK" ]]; then
            echo "::error::Confirmation must be exactly ROLLBACK."
            exit 1
          fi

          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use stable SemVer format such as v1.0.0."
            exit 1
          fi

      - name: Checkout repository metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag to immutable commit
        id: resolve
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          expected_sha="$EXPECTED_COMMIT_SHA"

          if [[ -n "$expected_sha" && ! "$expected_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Expected commit must be a full SHA when provided."
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "::error::Tag $tag does not exist in this repository."
            exit 1
          fi

          commit_sha="$(git rev-list -n 1 "$tag")"
          if [[ -z "$commit_sha" ]]; then
            echo "::error::Could not resolve $tag to a commit."
            exit 1
          fi
          if [[ -n "$expected_sha" && "$commit_sha" != "$expected_sha" ]]; then
            echo "::error::Release tag no longer resolves to the expected commit."
            exit 1
          fi

          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "Rollback target: $tag -> $commit_sha"

      - name: Require a published stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          token = os.environ["GH_TOKEN"]

          url = (
              f"https://api.github.com/repos/{repo}/releases/tags/"
              f"{urllib.parse.quote(tag, safe='')}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "devobs-rollback",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as exc:
              print(f"::error::No published GitHub Release found for {tag} (HTTP {exc.code}).")
              sys.exit(1)

          if release.get("draft"):
              print("::error::Draft releases cannot be rollback targets.")
              sys.exit(1)

          if release.get("prerelease"):
              print("::error::Pre-releases cannot be rollback targets.")
              sys.exit(1)

          print(f"Validated stable release: {release.get('name') or tag}")
          PY

  quality:
    needs: validate
    if: needs.validate.result == 'success'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.validate.outputs.commit_sha }}
      validation_profile: rollback

  deploy:
    needs: [validate, quality]
    if: needs.quality.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout exact rollback commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false

      - name: Stage static site
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.commit_sha }}
        run: |
          set -euo pipefail

          mkdir -p _site
          cp index.html _site/index.html
          if [ -d assets ]; then
            cp -R assets _site/assets
          fi
          printf '{"schema_version":1,"source_sha":"%s"}\n' "$SOURCE_SHA" > _site/deployment.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy rollback release
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify production after rollback
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ needs.validate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          SITE_ROOT="${SITE_URL%/}"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "$SITE_URL" \
            --output site.html

          grep -q "AL-DALA MOBILE" site.html

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --header "Cache-Control: no-cache" \
            "$SITE_ROOT/deployment.json?run_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output deployment.json

          deployed_sha="$(jq -er 'select(.schema_version == 1) | .source_sha' deployment.json)"
          if [[ ! "$deployed_sha" =~ ^[0-9a-f]{40}$ || "$deployed_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::The rollback source SHA does not match the restored commit."
            exit 1
          fi
          echo "Rollback production health check passed for commit $deployed_sha."

      - name: Record rollback summary
        env:
          DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: |
          {
            echo "## Production rollback completed"
            echo
            echo "- Release: \`${{ needs.validate.outputs.release_tag }}\`"
            echo "- Commit: \`${{ needs.validate.outputs.commit_sha }}\`"
            echo "- Site: ${{ steps.deployment.outputs.page_url }}"
            echo "- Validation: tests + production HTTP health check passed"
            if [[ -n "$DISPATCH_ID" ]]; then echo "- Dispatch ID: \`$DISPATCH_ID\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"
