name: Rollback Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published stable release tag to redeploy (for example v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string
      confirmation:
        description: "Type ROLLBACK to confirm the production rollback"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}

    steps:
      - name: Validate rollback request
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "$CONFIRMATION" != "ROLLBACK" ]]; then
            echo "::error::Confirmation must be exactly ROLLBACK."
            exit 1
          fi

          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use stable SemVer format such as v1.0.0."
            exit 1
          fi

      - name: Checkout repository metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag to immutable commit
        id: resolve
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"

          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "::error::Tag $tag does not exist in this repository."
            exit 1
          fi

          commit_sha="$(git rev-list -n 1 "$tag")"
          if [[ -z "$commit_sha" ]]; then
            echo "::error::Could not resolve $tag to a commit."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$commit_sha" "$GITHUB_SHA"; then
            echo "::error::Release tag $tag does not point to a commit in this main-branch history."
            exit 1
          fi

          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "Rollback target: $tag -> $commit_sha"

      - name: Require a published stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          token = os.environ["GH_TOKEN"]

          url = (
              f"https://api.github.com/repos/{repo}/releases/tags/"
              f"{urllib.parse.quote(tag, safe='')}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "devobs-rollback",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as exc:
              print(f"::error::No published GitHub Release found for {tag} (HTTP {exc.code}).")
              sys.exit(1)

          if release.get("draft"):
              print("::error::Draft releases cannot be rollback targets.")
              sys.exit(1)

          if release.get("prerelease"):
              print("::error::Pre-releases cannot be rollback targets.")
              sys.exit(1)

          if release.get("tag_name") != tag:
              print("::error::GitHub Release tag does not match the requested rollback tag.")
              sys.exit(1)

          print(f"Validated stable release: {release.get('name') or tag}")
          PY

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout exact rollback commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false

      - name: Re-run release validation tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/check_site.py

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d assets ]; then
            cp -R assets _site/assets
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy rollback release
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify production after rollback
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "$SITE_URL" \
            --output site.html

          grep -q "AL-DALA MOBILE" site.html
          echo "Rollback production health check passed."

      - name: Record rollback summary
        run: |
          {
            echo "## Production rollback completed"
            echo
            echo "- Release: \`${{ needs.validate.outputs.release_tag }}\`"
            echo "- Commit: \`${{ needs.validate.outputs.commit_sha }}\`"
            echo "- Site: ${{ steps.deployment.outputs.page_url }}"
            echo "- Validation: tests + production HTTP health check passed"
          } >> "$GITHUB_STEP_SUMMARY"
