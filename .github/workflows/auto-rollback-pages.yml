name: Guarded automatic Pages rollback

on:
  workflow_run:
    workflows: ["Deployment Health Check"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: pages-auto-rollback
  cancel-in-progress: false

jobs:
  dispatch-rollback:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.PAGES_AUTO_ROLLBACK_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm the production health-check step itself failed
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          failed_steps="$(gh api "repos/$GH_REPO/actions/runs/$FAILED_RUN_ID/jobs?per_page=100" --jq '[.jobs[].steps[]? | select(.name == "Verify deployed site" and .conclusion == "failure")] | length')"
          if [[ "$failed_steps" == "1" ]]; then
            echo "health_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "health_failed=false" >> "$GITHUB_OUTPUT"
            echo "Rollback not dispatched: the production site verification step did not fail." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate a published stable rollback release
        if: steps.eligibility.outputs.health_failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ vars.PAGES_ROLLBACK_RELEASE_TAG }}
          FAILED_CHECK_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Set PAGES_ROLLBACK_RELEASE_TAG to a stable tag such as v1.2.3."
            exit 1
          fi
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq 'select(.draft == false and .prerelease == false) | .tag_name' >/dev/null
          {
            echo "## Automatic rollback authorized by configuration"
            echo
            echo "- Failed production health check: $FAILED_CHECK_RUN"
            echo "- Stable release target: $RELEASE_TAG"
            echo "- This job only dispatches the existing validated rollback workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch the protected rollback workflow
        if: steps.eligibility.outputs.health_failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ vars.PAGES_ROLLBACK_RELEASE_TAG }}
        run: gh workflow run rollback-pages.yml --ref main --field release_tag="$RELEASE_TAG" --field confirmation=ROLLBACK
