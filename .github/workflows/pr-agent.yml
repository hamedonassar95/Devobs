name: Optional PR-Agent review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-agent-review:
    name: Advisory PR-Agent review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      vars.DEVOBS_AI_REVIEW_PROVIDER == 'pr-agent' &&
      vars.DEVOBS_AI_BUDGET_APPROVED == 'true' &&
      vars.DEVOBS_PR_AGENT_PROVENANCE_VERIFIED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check whether the existing API secret is configured
        id: credential
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR-Agent skipped because OPENAI_API_KEY is not configured."
            echo "PR-Agent did not run because the existing API secret is absent." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Review the pull request with pinned PR-Agent 0.49.0
        if: steps.credential.outputs.enabled == 'true'
        uses: docker://pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c # PR-Agent 0.49.0-github_action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
