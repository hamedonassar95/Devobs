name: Compile Agentic Workflow

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/incident-investigator.md"
      - ".github/workflows/compile-agentic-workflow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned gh-aw compiler
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/github/gh-aw/releases/download/v0.89.21/linux-amd64 \
            --output /tmp/gh-aw
          echo "1c74ff5fc28b1891d32b67f4348a9b7f750946b6d4a721e909187a848868016b  /tmp/gh-aw" \
            | sha256sum --check -
          chmod +x /tmp/gh-aw
          /tmp/gh-aw version

      - name: Compile investigator
        run: |
          set -euo pipefail
          /tmp/gh-aw compile incident-investigator --strict
          test -s .github/workflows/incident-investigator.lock.yml

      - name: Upload compiled lock workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: incident-investigator-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/workflows/incident-investigator.lock.yml
          if-no-files-found: error
          retention-days: 7
