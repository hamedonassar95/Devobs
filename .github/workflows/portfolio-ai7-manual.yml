name: Portfolio AI-7 Public CI Observation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ai7-manual
  cancel-in-progress: false

jobs:
  observe:
    name: Analyze public CI evidence (read-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Check out reviewed repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node 24 runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Observe approved public CI and sanitize AI-7 artifact
        id: observe
        shell: bash
        env:
          REPORT_INPUT: ${{ runner.temp }}/portfolio-public-ci-raw.json
          REPORT_ARTIFACT: ${{ runner.temp }}/portfolio-public-ci-ai7.json
        run: |
          set -euo pipefail
          umask 077
          outcome=0
          node scripts/portfolio_ci_ai7_live.mjs > "$REPORT_INPUT" || outcome=$?
          if (( outcome > 1 )); then
            echo "::error::Public GitHub observation or AI-7 report failed validation."
            exit 2
          fi
          node scripts/portfolio_ai7_action_report.mjs --input "$REPORT_INPUT" --output "$REPORT_ARTIFACT"
          echo "observation_exit=$outcome" >> "$GITHUB_OUTPUT"
          echo "valid_report=true" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized public evidence for owner review
        if: steps.observe.outputs.valid_report == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-public-ci-ai7
          path: ${{ runner.temp }}/portfolio-public-ci-ai7.json
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed on incomplete public CI evidence
        if: steps.observe.outputs.valid_report == 'true' && steps.observe.outputs.observation_exit != '0'
        shell: bash
        run: |
          echo "::error::Partial or missing public CI evidence. Inspect the sanitized artifact; no green report is inferred."
          exit 1
