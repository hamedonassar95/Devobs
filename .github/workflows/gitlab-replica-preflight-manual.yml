name: GitLab Replica Read-only Preflight

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gitlab-replica-preflight-manual
  cancel-in-progress: false

jobs:
  compare:
    name: Public GitLab ancestry only (NO SYNC)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout complete reviewed main history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use pinned Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.15'

      - name: Compare public Git refs and local ancestry (never push)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gitlab_hosted_preflight.py --repo .

      - name: Classify GitLab merge-request policy separately from Git fast-forward (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gitlab_merge_policy.py
