AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Optional public HTTPS edge and zero-task Fargate service for Devobs.
  Requires an existing VPC, public and private subnets, an issued ACM certificate,
  and the foundation stack outputs. Route 53 record creation is opt-in.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC that contains all four subnets.
  VpcCidrBlock:
    Type: String
    Description: Primary IPv4 CIDR block of VpcId, used to constrain security-group rules.
    AllowedPattern: '^([0-9]{1,3}[.]){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$'
    ConstraintDescription: Enter the VPC IPv4 CIDR block, for example 10.0.0.0/16.
  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in the first Availability Zone.
  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in a different Availability Zone.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
    Description: Private task subnet in the first Availability Zone.
  PrivateSubnetB:
    Type: AWS::EC2::Subnet::Id
    Description: Private task subnet in a different Availability Zone.
  DomainName:
    Type: String
    Description: Fully qualified hostname covered by AcmCertificateArn.
    AllowedPattern: '^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$'
    ConstraintDescription: Enter a fully qualified DNS name without a trailing dot.
  HostedZoneId:
    Type: String
    Default: ''
    Description: Public Route 53 hosted zone ID; required only when CreateDnsRecord is true.
    AllowedPattern: '^$|^Z[A-Z0-9]+$'
    ConstraintDescription: Enter a Route 53 hosted zone ID beginning with Z.
  CreateDnsRecord:
    Type: String
    Default: 'false'
    Description: Set true only when this stack should manage a new Route 53 A alias record.
    AllowedValues:
      - 'true'
      - 'false'
  AcmCertificateArn:
    Type: String
    Description: Issued ACM certificate in this stack's region whose SAN covers DomainName.
    AllowedPattern: '^arn:aws(-[a-z0-9-]+)?:acm:[a-z0-9-]+:[0-9]{12}:certificate/[0-9A-Fa-f-]+$'
    ConstraintDescription: Enter an ACM certificate ARN for this account and an AWS region.
  EcsClusterName:
    Type: String
    Default: devobs-production
    Description: Must match EcsClusterName from the foundation stack.
    AllowedPattern: '^[A-Za-z0-9_-]{1,255}$'
  EcsServiceName:
    Type: String
    Default: devobs-site
    Description: Must match EcsServiceName from the foundation stack and GitHub ECS_SERVICE variable.
    AllowedPattern: '^[A-Za-z0-9_-]{1,255}$'
  TaskExecutionRoleArn:
    Type: String
    Description: TaskExecutionRoleArn output from infra/ecs-foundation.yml.
    AllowedPattern: '^arn:aws(-[a-z0-9-]+)?:iam::[0-9]{12}:role/.+$'
    ConstraintDescription: Enter the task execution role ARN from the foundation stack.

Conditions:
  ManageRoute53Record: !Equals [!Ref CreateDnsRecord, 'true']

Resources:
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP and HTTPS ingress for the Devobs application load balancer.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref VpcCidrBlock
      Tags:
        - Key: Project
          Value: Devobs
        - Key: ManagedBy
          Value: CloudFormation

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow web traffic only from the Devobs application load balancer.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: !Ref VpcCidrBlock
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: !Ref VpcCidrBlock
      Tags:
        - Key: Project
          Value: Devobs
        - Key: ManagedBy
          Value: CloudFormation

  ApplicationTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      IpAddressType: ipv4
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Project
          Value: Devobs
        - Key: ManagedBy
          Value: CloudFormation

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Tags:
        - Key: Project
          Value: Devobs
        - Key: ManagedBy
          Value: CloudFormation

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            Host: '#{host}'
            Path: '/#{path}'
            Query: '#{query}'
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref AcmCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApplicationTargetGroup

  BootstrapTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: devobs-site
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      ContainerDefinitions:
        - Name: devobs-web
          Image: nginxinc/nginx-unprivileged:stable-alpine-slim@sha256:7f79f463c6eb0d0bf8782992bb9636434398e3e5848398805aef2c9b025d8609
          Essential: true
          Cpu: 128
          MemoryReservation: 128
          User: '101:101'
          PortMappings:
            - ContainerPort: 8080
              HostPort: 8080
              Protocol: tcp
          HealthCheck:
            Command:
              - CMD-SHELL
              - wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 15
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/devobs-site
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          StopTimeout: 30
      Tags:
        - Key: Project
          Value: Devobs
        - Key: ManagedBy
          Value: CloudFormation

  EcsService:
    Type: AWS::ECS::Service
    DependsOn:
      - BootstrapTaskDefinition
      - HttpsListener
    Properties:
      Cluster: !Ref EcsClusterName
      ServiceName: !Ref EcsServiceName
      DesiredCount: 0
      LaunchType: FARGATE
      SchedulingStrategy: REPLICA
      # Use the family without a revision so ECS resolves the latest active revision registered by GitHub Actions.
      TaskDefinition: devobs-site
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 60
      EnableExecuteCommand: false
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref TaskSecurityGroup
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
      LoadBalancers:
        - ContainerName: devobs-web
          ContainerPort: 8080
          TargetGroupArn: !Ref ApplicationTargetGroup
      Tags:
        - Key: Project
          Value: Devobs
        - Key: ManagedBy
          Value: CloudFormation

  ApplicationDnsRecord:
    Condition: ManageRoute53Record
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false

Outputs:
  ApplicationUrl:
    Description: HTTPS URL for the hostname covered by the ACM certificate.
    Value: !Sub 'https://${DomainName}'

  LoadBalancerDnsName:
    Description: AWS load balancer hostname behind the Route 53 alias.
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  EcsClusterName:
    Description: Set as the ECS_CLUSTER GitHub repository variable.
    Value: !Ref EcsClusterName

  EcsServiceName:
    Description: Set as the ECS_SERVICE GitHub repository variable.
    Value: !Ref EcsServiceName

  TaskSecurityGroupId:
    Description: Security group attached to private Fargate tasks.
    Value: !Ref TaskSecurityGroup
