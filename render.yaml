# Proposed P01 staging only. Creating this public service can start an initial build/deploy.
# Free plan usage may still incur build/egress charges; no provider action is authorized here.
previews:
  generation: off
services:
  - type: web
    name: devobs-ai-staging
    runtime: python
    plan: free
    region: frankfurt
    autoDeployTrigger: off
    buildCommand: python3 -m pip install --disable-pip-version-check -r requirements-api.txt
    startCommand: gunicorn --chdir scripts --workers 1 --bind 0.0.0.0:10000 --timeout 30 devobs_intelligence.staging_app:application
    healthCheckPath: /readyz
    envVars:
      - key: DEVOBS_PG_DSN
        sync: false
      - key: DEVOBS_OIDC_ISSUER
        sync: false
      - key: DEVOBS_OIDC_AUDIENCE
        sync: false
      - key: DEVOBS_OIDC_CLIENT_ID
        sync: false
      - key: DEVOBS_OIDC_METADATA_JSON
        sync: false
      - key: DEVOBS_OIDC_JWKS_JSON
        sync: false
