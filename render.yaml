# Proposed temporary P01 staging only. Importing this Blueprint creates resources and
# starts an initial build/deploy. Free Postgres expires after 30 days.
# No provider action is performed by this file or authorized by a repository check.
previews:
  generation: off
services:
  - type: web
    name: devobs-ai-staging
    runtime: python
    plan: free
    region: frankfurt
    autoDeployTrigger: off
    buildCommand: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-api.lock
    startCommand: gunicorn --chdir scripts --workers 1 --bind 0.0.0.0:$PORT --timeout 30 devobs_intelligence.staging_app:application
    healthCheckPath: /readyz
    envVars:
      - key: DEVOBS_PG_TLS_MODE
        value: render-internal-require
      - key: DEVOBS_AI_DIAGNOSTICS_ENABLED
        value: "false"
      - key: DEVOBS_AI_BUDGET_APPROVED
        value: "false"
      - key: DEVOBS_AI_MODEL
        value: gpt-6-luna

databases:
  - name: devobs-ai-staging-db
    databaseName: devobs_ai_staging
    user: devobs_ai_staging_admin
    postgresMajorVersion: "17"
    plan: free
    region: frankfurt
    ipAllowList: []
